apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: vscode-nitro
spec:
  podTemplate:
    spec:
      # Use the EKS-managed RuntimeClass to add isolation without node setup.
      runtimeClassName: isolated-sandbox
      containers:
      - name: code-server
        # Pin the image so this guide keeps the tested behavior.
        image: codercom/code-server:4.145.2
        securityContext:
          runAsNonRoot: true
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
